name: Daily Stock Market Brief

on:
  schedule:
    # 7:30 AM IST = 2:00 AM UTC. Runs every day; change to "30 2 * * 1-5"
    # for weekdays only (IST is UTC+5:30, so 2:00 UTC = 7:30 IST).
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated index.html

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python agent.py

      - name: Commit updated site
        run: |
          git config user.name "stock-brief-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Daily market brief update $(date -u +'%Y-%m-%d')"
          git push
